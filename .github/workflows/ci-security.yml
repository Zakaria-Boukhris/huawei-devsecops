name: CI Securite DevSecOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secrets:
    name: Detection de secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code=1

  sast:
    name: SAST (Semgrep + Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils
        run: pip install semgrep bandit
      - name: Semgrep (analyse statique)
        run: semgrep scan --config=auto --severity=ERROR --error .
      - name: Bandit (analyse Python)
        run: bandit -r . -ll

  iac:
    name: Audit IaC (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov (Dockerfile + manifestes K8s)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            bridgecrew/checkov -d /src \
            --framework dockerfile kubernetes \
            --compact --soft-fail

  build-scan-push:
    name: Build, scan CVE et push
    needs: [secrets, sast, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l image en minuscules
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Connexion a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build de l image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Scan CVE Trivy (gate CRITICAL/HIGH)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Push vers ghcr.io
        run: |
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
