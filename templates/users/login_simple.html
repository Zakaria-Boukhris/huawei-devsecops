<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Système Huawei</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: sans-serif;
        }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            text-align: center;
            color: red;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .btn-red {
            background-color: red;
            color: white;
        }

        .btn-red:hover {
            background-color: darkred;
        }

        .help-text {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>HUAWEI</h2>
    <p>Connexion au système</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Mot de passe</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-red w-100" id="loginBtn">Se connecter</button>
    </form>

    <div class="help-text">
        <a href="#" onclick="aide()">Besoin d’aide ?</a>
    </div>
</div>

<script>
    
    function aide() {
        alert("Pour vous connecter, utilisez un compte valide.\n\nExemple :\nAdmin : admin@huawei.com / admin123\nEmployé : employe@huawei.com / employe123");
    }

    
    document.querySelector('form').addEventListener('submit', function(e) {
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value.trim();

        if (!email || !password) {
            alert("Veuillez remplir tous les champs.");
            e.preventDefault();
            return;
        }

        document.getElementById('loginBtn').innerText = "Connexion...";
    });
</script>

</body>
</html>
